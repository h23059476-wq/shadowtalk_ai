name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npx --yes firebase-tools@14 emulators:exec --project demo-shadowtalk-auth-rules --only firestore "npm test"
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run build
        # Same OOM guard as ci.yml: echarts + mermaid made the Vite graph
        # exceed the default heap (exit 134 on c11dc8f4).
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # ------------------------------------------------------------------
      # Firestore rules + indexes deploy on every main merge.
      #
      # Why this exists (2026-11-09 incident): the rules file is CI-tested
      # against the emulator, but hosting deploys never shipped it. The
      # ruleset live in the project predated the per-user data whitelist, so
      # every conversations/messages write was rejected with permission-denied
      # and new users' chats silently vanished on refresh. Deploying the rules
      # together with the app makes this drift impossible going forward.
      # ------------------------------------------------------------------
      - name: Write Firebase service account for rules deploy
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"
      - name: Deploy Firestore rules and indexes
        # ----------------------------------------------------------------
        # continue-on-error: a rules-auth failure (e.g. FIREBASE_SERVICE_ACCOUNT
        # rotated/invalid) must not block the hosting deploy and IndexNow
        # submission behind it. The step stays visibly red on every run until
        # the secret is fixed, and content keeps shipping meanwhile.
        # Restore to blocking once the service account secret is verified.
        # ----------------------------------------------------------------
        continue-on-error: true
        run: npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes --project shadowtalk-ai-7a513 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
      # ------------------------------------------------------------------
      # Cloud Functions deploy was removed on 2026-11-24: the functions
      # pipeline had been shipping nothing (deploy step dead, every
      # cloudfunctions.net endpoint 404 in production). The branded auth
      # emails (sendVerificationEmail + requestPasswordReset via Resend) now
      # come from the Cloudflare Worker deployed by scripts/deploy_cf_worker.py
      # (https://shadowtalk-email.z67061935.workers.dev), which the app
      # targets through `functionsBaseUrl` in src/integrations/firebase/app.ts.
      # The functions/ source stays in the repo as reference; ci.yml still
      # type-checks it.
      # ------------------------------------------------------------------
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: shadowtalk-ai-7a513
      # ------------------------------------------------------------------
      # IndexNow — instant indexing for Bing, Seznam, Yandex and Brave.
      # Bing's index feeds ChatGPT Search and Copilot citations, so pinging
      # it on every deploy gets new guides and head-to-heads into AI answer
      # engines days before their organic crawl would.
      #
      # Non-fatal: a failed submission must never roll back a good deploy.
      # The key is public by design (IndexNow ownership proof is a public
      # key file at /d13c725ef8b8d4b4bc693b954d61c248.txt).
      # ------------------------------------------------------------------
      - name: Submit sitemap URLs to IndexNow
        if: success()
        run: node scripts/submit-indexnow.mjs || echo "::warning::IndexNow submission failed (non-fatal)"
