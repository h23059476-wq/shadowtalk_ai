name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npx --yes firebase-tools@14 emulators:exec --project demo-shadowtalk-auth-rules --only firestore "npm test"
      - run: npm run build
      - run: npm ci --prefix functions
      - run: npm --prefix functions run build
      # ------------------------------------------------------------------
      # Firestore rules + indexes deploy on every main merge.
      #
      # Why this exists (2026-11-09 incident): the rules file is CI-tested
      # against the emulator, but hosting deploys never shipped it. The
      # ruleset live in the project predated the per-user data whitelist, so
      # every conversations/messages write was rejected with permission-denied
      # and new users' chats silently vanished on refresh. Deploying the rules
      # together with the app makes this drift impossible going forward.
      # ------------------------------------------------------------------
      - name: Write Firebase service account for rules deploy
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"
      - name: Deploy Firestore rules and indexes
        run: npx --yes firebase-tools@14 deploy --only firestore:rules,firestore:indexes --project shadowtalk-ai-7a513 --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: shadowtalk-ai-7a513
