<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- Security -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(self), microphone=(self), camera=(self), payment=(self), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" />

    <!-- Primary SEO -->
    <title>ShadowTalk AI — Agentic AI Workspace</title>
    <meta name="description" content="One agentic AI workspace: encrypted multi-model chat, deep research with citations, ProofLoop missions, voice and IDE. Free with BYOK — no subscription, no card." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://www.shadowtalk-ai.com/" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.shadowtalk-ai.com/" />
    <meta property="og:site_name" content="ShadowTalk AI" />
    <meta property="og:title" content="ShadowTalk AI — Agentic AI Workspace" />
    <meta property="og:description" content="One workspace for agents, research, code & voice. Free to use, no card. Think AI. Think ShadowTalk." />
    <meta property="og:image" content="https://www.shadowtalk-ai.com/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShadowTalk AI — Agentic AI Workspace" />
    <meta name="twitter:description" content="One workspace for agents, research, code & voice. Free to use, no card. Think AI. Think ShadowTalk." />
    <meta name="twitter:image" content="https://www.shadowtalk-ai.com/og-image.svg" />

    <!-- PWA / app identity -->
    <meta name="theme-color" content="#050508" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShadowTalk" />
    <meta name="application-name" content="ShadowTalk AI" />
    <meta name="msapplication-TileColor" content="#050508" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Icons & manifest -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.shadowtalk-ai.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.shadowtalk-ai.com" />

    <!-- Live mode typefaces (Sora / Hanken Grotesk / JetBrains Mono) + Material Symbols icons -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Sora:wght@300..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />

    <!-- Structured data: one graph, shared @ids, current product facts only.
         Per-page JSON-LD is injected by src/components/SEOHead.tsx. -->
    <script type="application/ld+json">
    {

      "@graph": [
        {
          "@type": "Organization",

          "sameAs": [
            "https://www.linkedin.com/in/zain-ahmed-917b6b3a6",
            "https://www.instagram.com/shadowtalk_ai",
            "https://github.com/zain836/shadowtalk-ai-903ca615"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "shadowtalk@shadowtalk-ai.com",
            "availableLanguage": ["English"]
          }
        },
        {
          "@type": "Person",
          "@id": "https://www.shadowtalk-ai.com/#zain-ahmed-fahad-patel-shadowtalk",
          "name": "Zain Ahmed Fahad Patel",
          "alternateName": ["Zain Ahmed", "Zain Ahmed — ShadowTalk AI"],
          "givenName": "Zain",
          "additionalName": "Ahmed Fahad",
          "familyName": "Patel",

          "description": "Founder of ShadowTalk AI — an agentic AI workspace built in Karachi, Pakistan.",
          "url": "https://www.shadowtalk-ai.com/founder",
          "worksFor": { "@id": "https://www.shadowtalk-ai.com/#organization" },
          "homeLocation": { "@type": "Place", "name": "Karachi, Pakistan" },
          "knowsAbout": ["Artificial Intelligence", "Local-first software", "On-device LLM inference", "Agentic AI systems", "Privacy-preserving AI"],
          "sameAs": [
            "https://www.linkedin.com/in/zain-ahmed-917b6b3a6",
            "https://www.instagram.com/shadowtalk_ai",
            "https://github.com/zain836/shadowtalk-ai-903ca615"
          ]
        },
        {
          "@type": "WebSite",

        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://www.shadowtalk-ai.com/#application",

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
